<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Book Appointment - MedCare</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="container nav-container">

            <a href="index.html" class="logo">
                Med<span>Care</span>
            </a>

            <nav>

                <ul class="nav-links">

                    <li>
                        <a href="index.html">
                            Home
                        </a>
                    </li>

                    <li>
                        <a href="doctors.html">
                            Doctors
                        </a>
                    </li>

                    <li>
                        <a href="history.html">
                            My Appointments
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <!-- ================= BOOKING SECTION ================= -->

    <section class="booking-section">

        <div class="container">

            <div class="booking-container">

                <div class="booking-heading">

                    <h1>
                        Book Your Appointment
                    </h1>

                    <p>
                        Fill in your details to schedule
                        an appointment with your doctor.
                    </p>

                </div>


                <form id="bookingForm">


                    <!-- Doctor -->

                    <div class="form-group">

                        <label for="doctor">
                            Select Doctor
                        </label>

                        <select
                            id="doctor"
                            name="doctor"
                            required
                        >

                            <option value="">
                                Select a Doctor
                            </option>

                            <option value="Dr. Rahul Sharma">
                                Dr. Rahul Sharma - Cardiology
                            </option>

                            <option value="Dr. Priya Verma">
                                Dr. Priya Verma - Dermatology
                            </option>

                            <option value="Dr. Amit Singh">
                                Dr. Amit Singh - Neurology
                            </option>

                            <option value="Dr. Neha Gupta">
                                Dr. Neha Gupta - Pediatrics
                            </option>

                            <option value="Dr. Arjun Mehta">
                                Dr. Arjun Mehta - Orthopedics
                            </option>

                            <option value="Dr. Sneha Kapoor">
                                Dr. Sneha Kapoor - Gynecology
                            </option>

                        </select>

                    </div>


                    <!-- Patient Name -->

                    <div class="form-group">

                        <label for="patientName">
                            Patient Name
                        </label>

                        <input
                            type="text"
                            id="patientName"
                            name="patientName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>


                    <!-- Date -->

                    <div class="form-group">

                        <label for="appointmentDate">
                            Appointment Date
                        </label>

                        <input
                            type="date"
                            id="appointmentDate"
                            name="appointmentDate"
                            required
                        >

                    </div>


                    <!-- Time -->

                    <div class="form-group">

                        <label for="appointmentTime">
                            Appointment Time
                        </label>

                        <select
                            id="appointmentTime"
                            name="appointmentTime"
                            required
                        >

                            <option value="">
                                Select Time
                            </option>

                            <option value="09:00 AM">
                                09:00 AM
                            </option>

                            <option value="10:00 AM">
                                10:00 AM
                            </option>

                            <option value="11:00 AM">
                                11:00 AM
                            </option>

                            <option value="12:00 PM">
                                12:00 PM
                            </option>

                            <option value="02:00 PM">
                                02:00 PM
                            </option>

                            <option value="03:00 PM">
                                03:00 PM
                            </option>

                            <option value="04:00 PM">
                                04:00 PM
                            </option>

                            <option value="05:00 PM">
                                05:00 PM
                            </option>

                        </select>

                    </div>


                    <!-- Reason -->

                    <div class="form-group">

                        <label for="reason">
                            Reason for Visit
                        </label>

                        <textarea
                            id="reason"
                            name="reason"
                            rows="4"
                            placeholder="Enter reason for appointment"
                        ></textarea>

                    </div>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="btn booking-btn"
                    >
                        Confirm Appointment
                    </button>


                </form>

            </div>

        </div>

    </section>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <div class="footer-bottom">

            <p>
                © 2026 MedCare. All Rights Reserved.
            </p>

        </div>

    </footer>


    <!-- Booking JavaScript -->

    <script src="js/booking.js"></script>

</body>

</html>
